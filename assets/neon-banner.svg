<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">THAN.TRING1 — Trading Automation</title>
  <desc id="desc">Neon synthwave banner with market chart lines in purple, magenta, and cyan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b18"/>
      <stop offset=".52" stop-color="#171034"/>
      <stop offset="1" stop-color="#090b18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#f044e8"/>
      <stop offset="1" stop-color="#38d9ff"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
